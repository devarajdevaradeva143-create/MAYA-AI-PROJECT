name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tests, type-check (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff (our source only, vendor excluded)
        run: uvx --from ruff==0.11.10 ruff check --exclude JARVIS/custom/vendor JARVIS/custom "MAYA INTELLIGENCE"

      - name: Install JARVIS dev deps (uv)
        working-directory: JARVIS
        run: uv sync --frozen --extra dev --extra semantic

      - name: JARVIS core tests
        working-directory: JARVIS
        run: uv run --frozen --extra dev --extra semantic python -m pytest custom/tests -q

      - name: MAYA INTELLIGENCE tests
        working-directory: MAYA INTELLIGENCE
        env:
          PYTHONPATH: ${{ github.workspace }}\JARVIS;${{ github.workspace }}\MAYA INTELLIGENCE
        run: uv run --project ../JARVIS --frozen --extra dev --extra semantic python -m pytest tests -q

      - name: Install Windows app dev deps (uv)
        working-directory: WINDOWS APPLICATION/windows
        run: uv sync --frozen --group dev

      - name: Windows app tests (offscreen Qt)
        working-directory: WINDOWS APPLICATION/windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --group dev python -m pytest tests -q

      - name: Install pyright
        run: python -m pip install pyright

      # Baseline: pyright reports pre-existing findings. Keep the signal visible
      # without blocking the first green CI run; tighten this after cleanup.
      - name: Type check (pyright, advisory)
        continue-on-error: true
        run: pyright
